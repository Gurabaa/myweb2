<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Order food</title>
</head>
<body><div class="wrap">
  <h1 class="sign">Order Now</h1>
  <p class="sub">Tick your dishes, set the quantity. The total updates by itself.</p>

  <form id="orderForm" action="https://formspree.io/f/mrpgnvyv" method="POST">
    <div class="cards">
      <div class="card item" data-name="Fried rice" data-price="2">
        <img src="1788402104456.png" alt="Fried rice">
        <div class="body">
          <span class="name">Fried rice</span>
          <span class="price">$2</span>
          <label class="pick" style="margin:0"><input type="checkbox" class="chk"> Choose</label>
          <label class="pick" style="margin:0">Qty <input type="number" class="qty" min="1" value="1"></label>
        </div>
      </div>
      <div class="card item" data-name="Tom Yum Kung (shrimp soup)" data-price="5">
        <img src="1791426163973.jpg" alt="Tom Yum Kung">
        <div class="body">
          <span class="name">Tom Yum Kung (shrimp soup)</span>
          <span class="price">$5</span>
          <label class="pick" style="margin:0"><input type="checkbox" class="chk"> Choose</label>
          <label class="pick" style="margin:0">Qty <input type="number" class="qty" min="1" value="1"></label>
        </div>
      </div>
    </div>

    <div class="total"><span>Total</span><b>$<span id="total">0</span></b></div>

    <div class="panel">
      <h3>Your details</h3>
      <label for="customer">Name</label>
      <input type="text" id="customer" name="name" required>
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" required>
      <label for="address">Delivery address</label>
      <textarea id="address" name="address" required></textarea>
    </div>

    <div class="panel">
      <h3>Your order (sent to email)</h3>
      <textarea id="order" name="order" readonly placeholder="Choose a dish above..."></textarea>
    </div>

    <p class="error" id="error" role="alert"></p>
    <p class="center"><button type="submit" class="red">Send order to email</button></p>
  </form>

  <p class="center"><a class="btn ghost" href="index.html">Back to home</a></p>
</div>
<script>
const items = document.querySelectorAll('.item');
const orderBox = document.getElementById('order');
const totalEl = document.getElementById('total');
const errorEl = document.getElementById('error');

function buildOrder() {
  let lines = [], total = 0;
  items.forEach(item => {
    const on = item.querySelector('.chk').checked;
    item.classList.toggle('on', on);
    if (on) {
      const price = Number(item.dataset.price);
      const qty = Math.max(1, parseInt(item.querySelector('.qty').value) || 1);
      total += price * qty;
      lines.push(`- ${item.dataset.name} x ${qty} = $${price * qty}`);
    }
  });
  totalEl.textContent = total;
  orderBox.value = lines.length ? "Order:\n" + lines.join("\n") + `\nTotal: $${total}` : "";
  return lines.length;
}
items.forEach(item => item.querySelectorAll('input').forEach(el => {
  el.addEventListener('input', buildOrder);
  el.addEventListener('change', buildOrder);
}));
document.getElementById('orderForm').addEventListener('submit', e => {
  errorEl.textContent = "";
  if (buildOrder() === 0) { e.preventDefault(); errorEl.textContent = "Please choose at least one dish before sending."; }
});
buildOrder();
</script>
</body>
      </html>
